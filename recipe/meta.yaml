{% set name = "pytest-click" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pytest_click-{{ version }}.tar.gz
  sha256: 12e314617a3d88b416d48d5afb869da75992dc08bed948d6214fff921b26daf6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.6.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - click >=6.0
    - pytest >=5.0

test:
  imports:
    - pytest_click
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Stranger6667/pytest-click
  summary: Pytest plugin for Click
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrisburr
